name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # `workflow_dispatch` accepts any ref, and the version check below only
      # binds to a tag when one is present. Without this guard a manual run
      # from a branch would publish straight to npm with the OIDC token.
      # Dispatching from a v* tag still works, which is what a retry needs.
      - name: Refuse to publish from a non-tag ref
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "This workflow publishes to npm and must run from a v* tag."
          echo "Got: $REF"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      - name: Use latest npm (required for trusted publisher oidc)
        run: npm install -g npm@latest

      # release-it bumps only the root package.json; packages/* are synced by
      # scripts/sync-versions.mjs in its after:bump hook. Publishing a tag
      # whose packages are still on the previous version would fail with E403
      # halfway through, so refuse before anything is published.
      - name: Verify the tag matches every package version
        env:
          # Never interpolate a ref into the shell. Refs may contain backticks,
          # `$` and `;`, and this job holds `id-token: write` (npm OIDC) plus
          # `contents: write` - a crafted tag would run as the publisher.
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            node scripts/sync-versions.mjs --check --tag "$RELEASE_TAG"
          else
            node scripts/sync-versions.mjs --check
          fi

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Verify generated data matches its generator
        run: yarn verify:data

      - name: Test with coverage
        run: yarn test --maxWorkers=2 --coverage

      - name: Build packages
        run: yarn build

      - name: Check core bundle size budget
        run: node scripts/check-size.mjs

      - name: Verify published tarball contents
        run: node scripts/check-pack.mjs

      # Order matters: the wrapper's `dependencies` reference the published
      # core version, so the core must exist on the registry first.
      # Skip a version that is already on the registry so that re-running the
      # workflow from the same tag can finish a partial release. Without this,
      # a failure in the wrapper step left the tag unreleasable: the retry died
      # on the core step with E403 before it ever reached the wrapper.
      - name: Publish password-intelligence
        working-directory: packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "password-intelligence@$VERSION" version > /dev/null 2>&1; then
            echo "password-intelligence@$VERSION is already published; skipping."
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: Publish react-native-password-intelligence
        working-directory: packages/react-native
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "react-native-password-intelligence@$VERSION" version > /dev/null 2>&1; then
            echo "react-native-password-intelligence@$VERSION is already published; skipping."
          else
            npm publish --provenance --access public --ignore-scripts
          fi

      - name: Pack tarballs and checksums for the release
        run: |
          mkdir -p dist-release
          for pkg in packages/core packages/react-native; do
            tarball=$(cd "$pkg" && npm pack --ignore-scripts --silent)
            mv "$pkg/$tarball" dist-release/
          done
          cd dist-release
          for tarball in *.tgz; do
            sha256sum "$tarball" > "${tarball}.sha256"
            cat "${tarball}.sha256"
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            CHANGELOG.md
            dist-release/*.tgz
            dist-release/*.tgz.sha256
