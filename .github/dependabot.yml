version: 2
updates:
  # CI workflow supply chain — most security-critical surface
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "03:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    # `include: scope` is deliberately absent: Dependabot already emits a
    # `(deps)` / `(deps-dev)` scope of its own, so enabling it produced titles
    # like `ci(deps): ...` -> `chore(deps)(deps-dev): ...`, which violates the
    # single-scope rule in COMMIT_CONVENTION.md and fails commitlint.
    commit-message:
      prefix: "ci"

  # Workspace root — shared dev toolchain
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "03:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor

  # Published packages — their dependencies ship to consumers
  - package-ecosystem: npm
    directories:
      - "/packages/core"
      - "/packages/react-native"
    # zxcvbn-ts v4 is an API rewrite, not a version bump: the options singleton
    # is replaced by a factory, the crack-time result is restructured, and the
    # dictionary keys are namespaced (`passwords` -> `passwords-common`), which
    # breaks the engine's dictionary branching silently rather than loudly.
    # Tracked as a 1.0.0 item in ROADMAP.md; drop this once it lands.
    ignore:
      - dependency-name: "@zxcvbn-ts/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@zxcvbn-ts/language-common"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: monthly
      day: monday
      time: "03:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development
        update-types:
          - patch
          - minor
