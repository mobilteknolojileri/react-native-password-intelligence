name: Setup
description: Setup Node.js and install dependencies

inputs:
  registry-url:
    description: npm registry URL - set only for publish jobs that need an .npmrc with auth wiring
    required: false
    default: ''
  node-version:
    description: Override the Node version from .nvmrc (used by the compatibility matrix)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        registry-url: ${{ inputs.registry-url }}

    - name: Resolve yarn cache folder
      id: yarn-config
      run: echo "cache-folder=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash

    # Cache yarn's DOWNLOAD cache, not node_modules. Caching node_modules and
    # skipping `yarn install` on a cache hit (the previous approach) meant a
    # restored-but-stale tree was never reconciled against yarn.lock. Install is
    # cheap once the downloads are warm, so it now always runs.
    - name: Cache yarn downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.yarn-config.outputs.cache-folder }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
